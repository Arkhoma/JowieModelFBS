<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 48" role="img" aria-label="JowieModel football">
  <!-- Speed lines -->
  <g stroke="#f5efe0" stroke-width="3.5" stroke-linecap="round">
    <line x1="2" y1="17" x2="16" y2="17"/>
    <line x1="6" y1="25" x2="18" y2="25"/>
    <line x1="2" y1="33" x2="16" y2="33"/>
  </g>
  <g transform="rotate(-20 48 25)">
    <!-- Offset drop shadow, then the ball -->
    <ellipse cx="51" cy="28" rx="26" ry="15" fill="#7d1523"/>
    <ellipse cx="48" cy="25" rx="26" ry="15" fill="#1c1a17" stroke="#f5efe0" stroke-width="2.5"/>
    <!-- End stripes -->
    <path d="M30 14.5 Q26 25 30 35.5" fill="none" stroke="#f5efe0" stroke-width="3"/>
    <path d="M66 14.5 Q70 25 66 35.5" fill="none" stroke="#f5efe0" stroke-width="3"/>
    <!-- Laces -->
    <g stroke="#f5efe0" stroke-width="2.5" stroke-linecap="round">
      <line x1="39" y1="25" x2="57" y2="25"/>
      <line x1="41" y1="21.5" x2="41" y2="28.5"/>
      <line x1="45.5" y1="21.5" x2="45.5" y2="28.5"/>
      <line x1="50" y1="21.5" x2="50" y2="28.5"/>
      <line x1="54.5" y1="21.5" x2="54.5" y2="28.5"/>
    </g>
  </g>
</svg>
